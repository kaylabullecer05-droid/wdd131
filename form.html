<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WDD 131 - Product Review Form - KAYLA MAE N. BULLECER</title>
<meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Week 05 Product Review Form by KAYLA MAE N. BULLECER">
<meta name="author" content="KAYLA MAE N. BULLECER">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/form.css">
<script src="scripts/form.js" defer></script>
</head>
<body>
<header>
<h1>Product Review</h1>
<p>Share what you think about your product!</p>
</header>
<main>
<form method="get" action="review.html">
<fieldset>
<legend>Product Details</legend>

<label for="productName">Product Name *</label>
<select id="productName" name="productName" required>
<option value="" disabled selected>Select a Product ...</option>
</select>

<div class="rating-group">
<span class="group-label" id="ratingLabel">Overall Rating *</span>
<div class="stars" role="radiogroup" aria-labelledby="ratingLabel">
<label for="rating1"><input type="radio" id="rating1" name="overallRating" value="1" required>☆<span>1</span></label>
<label for="rating2"><input type="radio" id="rating2" name="overallRating" value="2" required>☆☆<span>2</span></label>
<label for="rating3"><input type="radio" id="rating3" name="overallRating" value="3" required>☆☆☆<span>3</span></label>
<label for="rating4"><input type="radio" id="rating4" name="overallRating" value="4" required>☆☆☆☆<span>4</span></label>
<label for="rating5"><input type="radio" id="rating5" name="overallRating" value="5" required>☆☆☆☆☆<span>5</span></label>
</div>
<p class="hint">1 = Poor &nbsp; 5 = Excellent</p>
</div>

<label for="installDate">Date of Installation *</label>
<input type="date" id="installDate" name="installDate" required>
</fieldset>

<fieldset>
<legend>Your Experience</legend>
<span class="group-label">Which features did you find useful in the product?</span>
<p class="hint">Check all that apply</p>
<div class="checks">
<div><input type="checkbox" id="featureDurability" name="usefulFeatures" value="Durability"><label for="featureDurability">Durability</label></div>
<div><input type="checkbox" id="featureEase" name="usefulFeatures" value="Ease of Use"><label for="featureEase">Ease of Use</label></div>
<div><input type="checkbox" id="featurePerformance" name="usefulFeatures" value="Performance"><label for="featurePerformance">Performance</label></div>
<div><input type="checkbox" id="featureDesign" name="usefulFeatures" value="Design"><label for="featureDesign">Design</label></div>
</div>

<label for="writtenReview">Written Review</label>
<textarea id="writtenReview" name="writtenReview" rows="5" placeholder="Tell us about your experience..."></textarea>

<label for="userName">Your Name</label>
<input type="text" id="userName" name="userName" placeholder="Optional">
</fieldset>

<input type="submit" value="Post Review">
</form>
</main>
<footer>
<p>&copy; <span id="currentyear"></span> &#127796; KAYLA MAE N. BULLECER &#127796; Philippines</p>
<p id="lastModified"></p>
</footer>
</body>
</html>
